[package]
name = "floorline-escrow"
version = "1.0.0"
edition = "2021"
description = "Floorline escrow — the separate reserve contract. Only the vault's settle/recover paths can release it (invariant I1)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["legacy"] }
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
