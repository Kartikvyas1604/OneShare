[package]
name = "floorline-oracle"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["legacy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
unit-testing = ["near-sdk/unit-testing"]

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
