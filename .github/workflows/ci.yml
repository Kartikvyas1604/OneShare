name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust tests (unit + invariants)
        run: cd contracts && cargo test
      - name: Contract build (wasm)
        run: |
          cd contracts && cargo build
      - name: Secrets scan (no key material in git)
        run: |
          ! grep -rInE "ed25519:[A-Za-z0-9]{50,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk-[A-Za-z0-9]{20,}" app contracts scripts docs README.md package.json || true
          ! grep -rInE "ORACLE_SEED_HEX=[0-9a-f]{64}" .env.example

      - name: Copy hygiene (banned marketing phrases + asset-name rule)
        run: npm run check:copy

      - name: Production build
        run: npm run build

      - name: Audit (high and above; dev-only findings tracked in DECISIONS.md)
        run: npm audit --audit-level=critical

      - name: Start production server
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/healthz > /dev/null && break
            sleep 1
          done

      - name: Smoke test the production server
        run: node scripts/smoke.mjs http://localhost:3000

      - name: Install Playwright
        run: npx playwright install chromium --with-deps || npx playwright install chromium

      - name: E2E tests (against the running production server)
        run: E2E_NO_SERVER=1 npx playwright test
