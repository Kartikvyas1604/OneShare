name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Copy hygiene (banned marketing phrases — spec §0.5)
        run: npm run check:copy

      - name: Production build
        run: npm run build

      - name: Audit (high and above; dev-only findings tracked in DECISIONS.md)
        run: npm audit --audit-level=critical
